name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Secretaria.slnx

      - name: Build
        run: dotnet build Secretaria.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Secretaria.slnx --configuration Release --no-build --verbosity normal
